<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Leads | Class One Internal System</title>
  <link rel="icon" href="./favicon.png">
  <link rel="stylesheet" href="./modules/crm/crm.css">
  <style>
    :root {
      --mint: #6ed0a0;
      --mint-dark: #31a873;
      --soft: #eef8f3;
      --ink: #17212b;
      --muted: #66738a;
      --line: #dbe7e1;
      --danger: #e5484d;
      --nav: #15212c;
      --bg: #f7fbf8;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: 0; }
    a { color: inherit; text-decoration: none; }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-weight: 900; font-size: 11px; text-transform: uppercase; letter-spacing: .02em; }
    input, select, textarea { width: 100%; min-height: 42px; border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 11px; background: #fff; color: var(--ink); }
    textarea { min-height: 92px; resize: vertical; }
    .app-shell { height: 100%; min-height: 0; display: grid; grid-template-columns: 248px minmax(0, 1fr); overflow: hidden; }
    .sidebar { min-height: 0; display: flex; flex-direction: column; gap: 16px; padding: 18px 16px; background: var(--nav); color: #fff; overflow: hidden; }
    .sidebar-brand { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: center; }
    .sidebar-brand img { width: 92px; border-radius: 8px; background: #fff; }
    .sidebar-brand strong { display: block; font-size: 17px; line-height: 1.08; }
    .sidebar-nav { min-height: 0; overflow-y: auto; padding-right: 3px; }
    .nav-btn { width: 100%; display: block; text-align: left; color: #cbd5d1; background: transparent; padding: 12px 14px; border-radius: 8px; margin: 4px 0; font-weight: 850; font-size: 13px; }
    .nav-btn:hover, .nav-btn.active { color: var(--ink); background: var(--mint); }
    .settings-fixed { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 999px; color: #cbd5d1; background: transparent; font-size: 20px; }
    .settings-fixed:hover { background: var(--mint); color: #fff; }
    main { height: 100%; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 24px 12px; border-bottom: 1px solid var(--line); background: #fff; }
    .topbar h1 { margin: 0; font-size: 28px; line-height: 1.1; }
    .subtle { color: var(--muted); font-size: 13px; font-weight: 650; }
    #crmContent { flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 18px 24px 24px; }
    #crm, #crmModuleMount { height: 100%; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; box-shadow: 0 1px 0 rgba(23,33,43,.02); }
    #crm > .panel, #crmModuleMount > .panel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    #crm > .panel > :not(#leadList), #crmModuleMount > .panel > :not(#leadList) { flex: 0 0 auto; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .row.spread { justify-content: space-between; }
    .grid.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .btn { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 13px; border-radius: 8px; background: #eef5f1; color: var(--ink); font-weight: 900; white-space: nowrap; }
    .btn.small { min-height: 32px; padding: 7px 10px; font-size: 12px; }
    .btn.mint { background: var(--mint); color: var(--ink); }
    .btn.ghost { background: #eef5f1; }
    .btn.danger { background: var(--danger); color: #fff; }
    .metric { min-height: 76px; display: grid; gap: 2px; align-content: center; padding: 13px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); text-align: left; }
    .metric strong { display: block; font-size: 28px; line-height: 1; }
    .sales-summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .hide { display: none !important; }
    .empty { padding: 28px; color: var(--muted); text-align: center; font-weight: 800; }
    .modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 18px; background: rgba(23,33,43,.55); }
    .modal-card { max-height: calc(100vh - 36px); overflow: auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 24px 70px rgba(23,33,43,.28); }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--soft); color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 12px; }
    .crm-lead-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--line); padding: 9px 10px; text-align: left; }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .02em; }
    @media (max-width: 900px) {
      .app-shell { grid-template-columns: 78px minmax(0, 1fr); }
      .sidebar-brand { grid-template-columns: 1fr; }
      .sidebar-brand strong { display: none; }
      .sidebar-brand img { width: 48px; }
      .nav-btn { font-size: 0; text-align: center; padding: 12px 8px; }
      .nav-btn::before { content: attr(data-short); font-size: 13px; }
      .sales-summary, .grid.two { grid-template-columns: 1fr; }
      .topbar { padding: 14px; }
      #crmContent { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="./classone-logo.jpeg" alt="Class One">
        <strong>Class One<br>Internal<br>System</strong>
      </div>
      <nav class="sidebar-nav" aria-label="Main navigation">
        <a class="nav-btn" data-short="Home" href="./index.html">Dashboard</a>
        <a class="nav-btn" data-short="Biz" href="./index.html#reports">Business Dashboard</a>
        <a class="nav-btn" data-short="Week" href="./index.html#schedule">Weekly Timetable</a>
        <a class="nav-btn" data-short="Tutor" href="./index.html#teacherOverview">Teacher Overview</a>
        <a class="nav-btn" data-short="Class" href="./index.html#replacements">Class Management</a>
        <a class="nav-btn" data-short="Stu" href="./index.html#students">Students</a>
        <a class="nav-btn" data-short="Teach" href="./index.html#teachers">Teachers</a>
        <a class="nav-btn" data-short="Users" href="./index.html#users">Users</a>
        <a class="nav-btn active" data-short="CRM" href="./crm.html">CRM Leads</a>
        <a class="nav-btn" data-short="TCRM" href="./index.html#tutorCrm">Tutor CRM</a>
        <a class="nav-btn" data-short="PH" href="./index.html#publicHoliday">Public Holiday</a>
        <a class="nav-btn" data-short="Log" href="./index.html#activity">Activity Log</a>
      </nav>
      <a class="settings-fixed" href="./index.html#settings" title="Settings" aria-label="Settings">&#9881;</a>
    </aside>
    <main>
      <header class="topbar">
        <div>
          <h1>CRM Leads</h1>
          <div class="subtle" id="statusText">Preparing CRM...</div>
        </div>
        <div class="row">
          <span class="subtle" id="leadCountText"></span>
          <a class="btn ghost" href="./index.html">Back to Dashboard</a>
        </div>
      </header>
      <div id="crmContent">
        <section id="crm">
          <div id="crmModuleMount" class="empty">Loading CRM leads...</div>
        </section>
      </div>
    </main>
  </div>
  <script src="./shared/session.js"></script>
  <script src="./shared/api.js"></script>
  <script src="./modules/crm/crm.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => window.initCRM?.());
  </script>
</body>
</html>
