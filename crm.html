<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Leads | Class One Internal System</title>
  <link rel="icon" href="./favicon.png">
  <link rel="stylesheet" href="./modules/crm/crm.css?v=20260731-teacher-weekday-availability">
  <style>
    :root {
      --mint: #6ed0a0;
      --mint-dark: #31a873;
      --soft: #eef8f3;
      --ink: #17212b;
      --muted: #66738a;
      --line: #dbe7e1;
      --danger: #e5484d;
      --nav: #15212c;
      --bg: #f7fbf8;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: 0; }
    a { color: inherit; text-decoration: none; }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-weight: 900; font-size: 11px; text-transform: uppercase; letter-spacing: .02em; }
    input, select, textarea { width: 100%; min-height: 42px; border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 11px; background: #fff; color: var(--ink); }
    textarea { min-height: 92px; resize: vertical; }
    .crm-workspace { height: 100%; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    main { height: 100%; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); background: #fff; }
    .topbar-left, .topbar-actions { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .topbar-title { min-width: 0; }
    .topbar h1 { margin: 0; font-size: 24px; line-height: 1.05; }
    .subtle { color: var(--muted); font-size: 13px; font-weight: 650; }
    #crmContent { flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 10px 12px 12px; }
    #crm, #crmModuleMount { height: 100%; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; box-shadow: 0 1px 0 rgba(23,33,43,.02); }
    #crm > .panel, #crmModuleMount > .panel { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    #crm > .panel > :not(#leadList), #crmModuleMount > .panel > :not(#leadList) { flex: 0 0 auto; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .row.spread { justify-content: space-between; }
    .grid.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .btn { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 13px; border-radius: 8px; background: #eef5f1; color: var(--ink); font-weight: 900; white-space: nowrap; }
    .btn.small { min-height: 32px; padding: 7px 10px; font-size: 12px; }
    .btn.mint { background: var(--mint); color: var(--ink); }
    .btn.ghost { background: #eef5f1; }
    .btn.danger { background: var(--danger); color: #fff; }
    .metric { min-height: 76px; display: grid; gap: 2px; align-content: center; padding: 13px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); text-align: left; }
    .metric strong { display: block; font-size: 28px; line-height: 1; }
    .sales-summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
    .hide { display: none !important; }
    .empty { padding: 28px; color: var(--muted); text-align: center; font-weight: 800; }
    .modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 18px; background: rgba(23,33,43,.55); }
    .modal-card { max-height: calc(100vh - 36px); overflow: auto; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 24px 70px rgba(23,33,43,.28); }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--soft); color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 12px; }
    .crm-lead-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--line); padding: 9px 10px; text-align: left; }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .02em; }
    @media (max-width: 900px) {
      .sales-summary, .grid.two { grid-template-columns: 1fr; }
      .topbar { align-items: flex-start; flex-direction: column; padding: 12px; }
      .topbar-actions { width: 100%; justify-content: space-between; }
      #crmContent { padding: 8px; }
    }
  </style>
</head>
<body>
  <div class="crm-workspace">
    <main>
      <header class="topbar">
        <div class="topbar-left">
          <a class="btn ghost" href="./index.html" aria-label="Back to Dashboard">← Back to Dashboard</a>
          <div class="topbar-title">
            <h1>CRM Leads</h1>
            <div class="subtle" id="statusText">Preparing CRM...</div>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="subtle" id="leadCountText"></span>
        </div>
      </header>
      <div id="crmContent">
        <section id="crm">
          <div id="crmModuleMount" class="empty">Loading CRM leads...</div>
        </section>
      </div>
    </main>
  </div>
  <script src="./shared/session.js"></script>
  <script src="./shared/api.js"></script>
  <script src="./modules/crm/crm.js?v=20260731-teacher-weekday-availability"></script>
  <script>
    window.addEventListener("DOMContentLoaded", () => window.initCRM?.());
  </script>
</body>
</html>
